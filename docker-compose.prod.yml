services:
  app:
    build:
      context: .
      target: prod 
    container_name: subgame-api-prod
    restart: always 
    ports:
      - "8080:8080"
    env_file:        
      - .env
    depends_on:
      - mysql
      - redis
    

  mysql:
    image: mysql:8.4
    container_name: subgame-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"
    volumes:
      - subgame-mysql_data:/var/lib/mysql

  redis:
    image: redis:latest
    container_name: subgame-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  subgame-mysql_data: